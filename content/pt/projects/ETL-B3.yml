title: ETL B3 — pipeline de dados do mercado de ações (B3)
description: "Pipeline ETL para dados do mercado de ações brasileiro (B3): ingestão de fontes de mercado, transformação e consolidação de séries temporais e dados de referência, e carga em PostgreSQL. Implementado em Python, com FastAPI para APIs e Prefect para orquestração de fluxos, com foco em ingestão confiável e pipelines sustentáveis."
image: /projects/etl-b3.webp
url: "https://github.com/Gabriel-br07/etl-b3"
tags: ["Python", "FastAPI", "Prefect", "PostgreSQL", "TimescaleDB", "Playwright", "Polars", "Alembic", "Docker"]
date: "2026-03-15"
problem: "Disponibilizar os dados públicos do mercado de ações brasileiro (B3) de forma estruturada e consultável."
role: "Projeto pessoal, desenvolvido por mim."
decisions:
  - "Cargas idempotentes (upserts) com tabela de registro das execuções"
  - "Fluxos diário e intradiário agendados e orquestrados com Prefect"
  - "Dados expostos por uma API REST, com migrations versionadas"
