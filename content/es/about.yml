title: Sobre mí
description: Conoce más sobre mi trayectoria como desarrollador fullstack, mi forma de resolver problemas y aportar valor, y mi motivación para construir y aprender.
content: |
  Hola, soy desarrollador fullstack enfocado en productos web modernos — interfaces y sistemas que resuelven problemas reales y aportan valor medible a usuarios y equipos.

  Disfruto trabajar en toda la pila, desde experiencias de usuario claras e intuitivas hasta servicios de back-end e integraciones fiables. Mi enfoque es pragmático: entender el problema a fondo, alinear resultados y entregar soluciones mantenibles que escalan con el producto.

  Mi filosofía se basa en resolver problemas y entregar valor. Empiezo aclarando las necesidades del usuario y el contexto del negocio, luego itero con retroalimentación rápida. Me importan la arquitectura limpia, el rendimiento y la experiencia del desarrollador, porque los grandes productos no solo son usables, sino también fáciles de evolucionar.

  ### Qué me impulsa

  Me motiva crear y aprender sin parar. Me gusta llevar ideas del “concepto” al “producto funcionando”, validar supuestos pronto y mejorar con uso y feedback reales. Me entusiasman especialmente los proyectos donde puedo combinar disciplina de ingeniería con visión de producto para hacer la experiencia más simple, rápida y fiable.

  ### Cómo trabajo

  Valoro la claridad y la colaboración. Comunico el avance, documento decisiones cuando importa y construyo de forma que el siguiente cambio sea más fácil, no más difícil. Trabajando solo o en equipo, busco reducir la ambigüedad, asumir responsabilidad y entregar con constancia.

  ### Más allá de la pantalla

  Cuando no estoy construyendo productos, exploro nuevas tecnologías, experimento con proyectos paralelos y estudio diseño e ingeniería para afinar mi oficio. Aprendo de sistemas reales qué funcionó, qué no y por qué.

  Gracias por pasarte. Echa un vistazo a mis [proyectos](/es/projects) o [escríbeme](/es/#contact) si te gustaría colaborar.
