title: ETL B3 — pipeline de datos del mercado de valores (B3)
description: "Pipeline ETL para datos del mercado de valores brasileño (B3): ingesta de fuentes de mercado, transformación y consolidación de series temporales y datos de referencia, y carga en PostgreSQL. Implementado en Python, con FastAPI para APIs y Prefect para orquestación de flujos, con foco en ingesta fiable y pipelines mantenibles."
