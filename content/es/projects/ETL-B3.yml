url: "https://github.com/Gabriel-br07/etl-b3"
tags: ["Python", "FastAPI", "Prefect", "PostgreSQL", "TimescaleDB", "Playwright", "Polars", "Alembic", "Docker"]
date: "2026-03-15"
problem: "Poner a disposición los datos públicos del mercado de valores brasileño (B3) de forma estructurada y consultable."
role: "Proyecto personal, desarrollado por mí."
decisions:
  - "Cargas idempotentes (upserts) con tabla de registro de ejecuciones"
  - "Flujos diario e intradiario programados y orquestados con Prefect"
  - "Datos expuestos mediante una API REST, con migraciones versionadas"
